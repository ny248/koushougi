<!doctype html>
<html lang="ja" data-engine="browser">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>広将棋</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4efe6; color: #28231d; font: 16px system-ui, sans-serif; }
  main { width: min(100%, 80rem); margin: auto; padding: 1.5rem; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  h1 { margin: 0; font: bold 2rem serif; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 19rem;
    grid-template-areas: "board actions" "board guidance" "board details";
    grid-template-rows: 7.5rem 10rem minmax(0, 1fr); height: var(--board-height, auto);
    gap: 1rem; align-items: start; margin-top: 1rem; }
  .panel { background: #fffaf0; border: 1px solid #d9ccb8; border-radius: 8px; padding: 1rem; }
  .panel h2 { margin: 0 0 .5rem; font-size: 1rem; }
  .panel p { margin: 0; }
  .panel p + p:not([hidden]) { margin-top: .5rem; }
  .game-actions { grid-area: actions; height: 7.5rem; overflow: auto; }
  .guidance { grid-area: guidance; height: 10rem; overflow: auto; }
  .game-details { grid-area: details; display: grid; height: 100%; min-height: 0;
    grid-template-rows: 13rem minmax(0, 1fr); gap: 1rem; }
  #ability { height: 13rem; overflow: auto; }
  #ability-text { white-space: pre-line; }
  .game-history { height: 100%; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
  .game-history > :not(#recent) { flex-shrink: 0; }
  #choices:not(:empty) { margin-top: .75rem; }
  #recent { flex: 1; min-height: 5rem; overflow: auto; }
  #recent li { padding: .35rem 0; border-bottom: 1px solid #eee4d6; }
  #recent li[aria-current="step"] { background: #f1dfbd; font-weight: bold; }
  #recent li button { border: 0; background: none; color: inherit; text-align: left; font: inherit; cursor: pointer; padding: .2rem; }
  .record-tools { margin: .6rem 0; }
  #replay-slider { width: 100%; }
  #record-message { font-size: .9rem; white-space: pre-line; overflow-wrap: anywhere; }
  #replay-controls[hidden] { display: none; }
  .inspection { background-color: #bcc9e2; outline: 2px solid #445e8a; outline-offset: -2px; }
  .inspection-shot { box-shadow: inset 0 0 0 3px #a3522e; }
  @media (max-width: 1000px) {
    .layout { grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "actions" "guidance" "board" "details"; grid-template-rows: auto; height: auto; }
    .game-details { height: auto; grid-template-rows: 13rem 28rem; }
  }
  #status { min-height: 1.5em; }
  .scroll { grid-area: board; align-self: start; overflow: auto; }
  #board { min-width: 42rem; display: grid; grid-template-columns: 2rem repeat(19, 1fr);
    align-items: center; text-align: center; background: #deb77e; border: 1px solid #927447;
    border-radius: 6px; padding: 0.5rem; }
  .axis { font-size: 0.75rem; color: #533a24; }
  .cell { aspect-ratio: 1; padding: 0; border: 0; display: grid; place-items: center;
    background: linear-gradient(#917044, #917044) center / 1px 100% no-repeat,
      linear-gradient(#917044, #917044) center / 100% 1px no-repeat; cursor: pointer; }
  .stone { width: 92%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
    font: bold clamp(10px, 1.15vw, 15px) serif; white-space: nowrap; box-shadow: 0 1px 2px #50371e; }
  .black { background: #252722; color: #fff7e7; }
  .white { background: #fff5df; color: #2f2822; }
  .white.promoted { color: #a0171e; }
  .black.promoted { color: #ff817e; }
  .cell.last-origin { box-shadow: inset 0 0 0 2px #5c7494; }
  .cell.last-step { box-shadow: inset 0 0 0 3px #2e5d99; }
  .cell.last-shot { box-shadow: inset 0 0 0 3px #ab3f33; }
  #recent { margin: 0 0 .6rem; padding-left: 2.7rem; }
  #recent:empty { display: none; }
  .selected { background-color: #ebc452; outline: 2px solid #674900; outline-offset: -2px; }
  .destination { background-color: #9bc780; outline: 2px solid #356344; outline-offset: -2px; }
  .destination:empty::after { content: ''; width: 25%; aspect-ratio: 1; border-radius: 50%; background: #356344; }
  #choices { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .shot { background-color: #e7a381; outline-color: #883c24; }
  .cell:focus-visible { outline: 3px solid #174a82; z-index: 1; }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; }
  .control, #choices button, dialog select {
    padding: .45rem .65rem; border: 1px solid #897a66; border-radius: 5px;
    background: #fffaf0; color: inherit; font: inherit; }
  button.control:not(:disabled), #choices button { cursor: pointer; }
  button.control:disabled { color: #73695d; background: #eee7dc; border-color: #d9ccb8; }
  .control.primary { background: #4b3826; border-color: #4b3826; color: #fffaf0; }
  .control.danger { color: #8a2925; }
  dialog { width: min(25rem, calc(100% - 2rem)); max-height: calc(100% - 2rem);
    padding: 1.25rem; border: 1px solid #d9ccb8; border-radius: 8px;
    background: #fffaf0; color: inherit; }
  dialog::backdrop { background: rgb(40 35 29 / .55); }
  dialog h2 { margin: 0 0 1rem; font-size: 1.25rem; }
  dialog p { margin: 0 0 1rem; }
  dialog label:not([hidden]) { display: block; margin-bottom: 1rem; }
  dialog select { display: block; width: 100%; margin-top: .35rem; }
  dialog .actions { justify-content: flex-end; }
</style>
<main>
  <header>
    <h1>広将棋</h1>
    <button class="control" id="options" type="button" aria-haspopup="dialog" aria-controls="options-dialog">オプション</button>
  </header>
  <div class="layout">
    <section class="panel game-actions" aria-labelledby="game-actions-title">
      <h2 id="game-actions-title">対局操作</h2>
      <div class="actions">
        <button class="control primary" id="new-game" type="button" aria-haspopup="dialog" disabled>新しい対局</button>
        <button class="control" id="undo" type="button" disabled>待った</button>
        <button class="control danger" id="resign" type="button" aria-haspopup="dialog" disabled>投了</button>
      </div>
    </section>
    <section class="panel guidance" aria-label="着手の案内">
      <p id="status" role="status">盤面を読み込み中</p>
      <div id="choices" aria-label="一手の選択"></div>
    </section>
    <div class="scroll"><div id="board" aria-label="広将棋の盤面"></div></div>
    <div class="game-details">
      <section class="panel" id="ability" aria-label="駒の解説">
        <h2 id="ability-name">駒の解説</h2>
        <p id="ability-text">駒を選ぶと能力を表示します。</p>
      </section>
      <section class="panel game-history" aria-labelledby="history-title">
        <h2 id="history-title">棋譜</h2>
        <div class="actions record-tools">
          <button class="control" id="save-record" type="button" disabled>保存</button>
          <button class="control" id="open-record" type="button" disabled>開く</button>
          <input id="record-file" type="file" accept=".json,application/json" hidden>
        </div>
        <div id="replay-controls">
          <div class="actions">
            <button class="control" id="replay-return" type="button" disabled>棋譜を閉じる</button>
          </div>
          <p id="replay-position" role="status">棋譜を開くと再生できます。</p>
          <input id="replay-slider" type="range" min="0" max="0" value="0" disabled aria-label="再生する手数">
          <div class="actions record-tools">
            <button class="control" id="replay-first" type="button" disabled aria-label="初期局面">|◀</button>
            <button class="control" id="replay-prev" type="button" disabled aria-label="1手戻る">◀</button>
            <button class="control" id="replay-play" type="button" disabled>自動再生</button>
            <button class="control" id="replay-next" type="button" disabled aria-label="1手進む">▶</button>
            <button class="control" id="replay-last" type="button" disabled aria-label="最終局面">▶|</button>
          </div>
        </div>
        <p id="record-message" role="status"></p>
        <p id="empty-history">まだ着手はありません。</p>
        <ol id="recent" aria-label="棋譜"></ol>
      </section>
    </div>
  </div>
  <dialog id="options-dialog" aria-labelledby="options-title">
    <h2 id="options-title">オプション</h2>
    <p><button class="control" id="sound" type="button" aria-pressed="true">着手音オン</button></p>
    <form method="dialog" class="actions">
      <button class="control" type="submit">閉じる</button>
    </form>
  </dialog>
  <dialog id="new-game-dialog" aria-labelledby="new-game-title">
    <form id="new-game-form">
      <h2 id="new-game-title">新しい対局</h2>
      <p id="replace-game-note" hidden>新しい対局を始めると、現在の棋譜は消えます。</p>
      <label>対局相手
        <select id="opponent" autofocus>
          <option value="human">人</option>
          <option value="search">AI</option>
        </select>
      </label>
      <label id="toss-option" hidden>あなたの手番
        <select id="side-choice">
          <option value="black">先手</option>
          <option value="white">後手</option>
          <option value="toss">振り駒</option>
        </select>
      </label>
      <p id="toss-result" role="status" hidden></p>
      <div class="actions">
        <button class="control" id="cancel-new-game" type="button">キャンセル</button>
        <button class="control primary" id="start-game" type="submit">対局を始める</button>
      </div>
    </form>
  </dialog>
  <dialog id="promotion-dialog" aria-labelledby="promotion-title">
    <h2 id="promotion-title">成りを選択</h2>
    <div id="promotion-linked"></div>
    <div class="actions">
      <button class="control primary" id="promote" type="button">成る</button>
      <button class="control" id="decline-promotion" type="button">成らない</button>
    </div>
  </dialog>
  <dialog id="resign-dialog" aria-labelledby="resign-title">
    <form method="dialog">
      <h2 id="resign-title">投了しますか？</h2>
      <div class="actions">
        <button class="control" type="submit" value="cancel" autofocus>キャンセル</button>
        <button class="control danger" type="submit" value="resign">投了する</button>
      </div>
    </form>
  </dialog>
</main>

  const board = document.querySelector("#board");
  const status = document.querySelector("#status");
  const newGame = document.querySelector("#new-game");
  const newGameDialog = document.querySelector("#new-game-dialog");
  const newGameForm = document.querySelector("#new-game-form");
  const replaceGameNote = document.querySelector("#replace-game-note");
  const opponent = document.querySelector("#opponent");
  const tossOption = document.querySelector("#toss-option");
  let mode = "human";
  let humanSide = "black";
  const sideChoice = document.querySelector("#side-choice");
  const tossResult = document.querySelector("#toss-result");
  const startGame = document.querySelector("#start-game");
  let tossSide;
  const undo = document.querySelector("#undo");
  const resign = document.querySelector("#resign");
  const resignDialog = document.querySelector("#resign-dialog");
  const resignTitle = document.querySelector("#resign-title");
  let resignedSide;
  let gameActive = false;

  function undoLength() {
    if (mode === "human") return Math.max(0, history.length - 1);
    const opening = humanSide === "white" ? 1 : 0;
    const humanMoves = Math.ceil((history.length - opening) / 2);
    return opening + Math.max(0, humanMoves - 1) * 2;
  }
  const cells = new Map();
  let current;
  let history = [];
  let recent = [];
  const recentList = document.querySelector("#recent");
  const aiDelay = 700;
  const abilities = {
    歩兵: "縦横に1路。味方の鼓または霹靂がいないと前に進めない。",

    弩騎: "馬兵のように跳び、移動後は弩と同じ射撃ができる。",
    砲: "斜めに1路。移動後、8方向に5路まで1枚を射撃できる。牌総・天塁が射線を遮る。",

    千戸: "縦に何路でも、それ以外に1路進める。",
    百戸: "横に何路でも、それ以外に1路進める。",
    副司: "正面・斜めに何路でも進める。",
    前衝: "正面に何路でも、真後ろに1路進める。",
    後衝: "真後ろに何路でも、正面に1路進める。",
    天網: "横・斜め前に何路でも、真後ろに1路進める。",
    地網: "横・斜め後ろに何路でも、正面に1路進める。",
    記室: "斜めに1路、または縦横に2路跳ぶ。軍師に成ると味方の前衝・後衝も成れ、敵の毒火を除去する。",
    軍師: "記室の動きを、一手に2回まで行える。",
    参謀: "縦横に1路、または斜めに2路跳ぶ。",
    旗鼓: "参謀の動きを、一手に2回まで行える。",
    鷹揚: "斜めに何路でも、または縦横に1路ずつ2回まで進める。",
    虎翼: "縦横に何路でも、または斜めに1路ずつ2回まで進める。",
    千総: "縦横斜めに何路でも進める。",
    龍驤: "縦横斜めに何路でも、または周囲8方向に1路ずつ2回まで進める。",
    高道: "周囲8方向に2路跳ぶ。着地で取れるのは高道・神僧系。移動を終えた後、隣接する敵1枚を射撃対象として選べる。",
    五里霧: "高道と同じ跳躍を一手に2回まで。各移動の直後に、隣接する敵1枚を任意で射撃できる。射撃後も2回目の移動を続けられる。周囲5路で敵の射撃を封じる。敵の聖燈が近づくと高道に戻る。",
    神僧: "周囲8方向に2路跳ぶ。着地で取れるのは高道・神僧系。移動を終えた後、隣接する敵1枚を射撃対象として選べる。",
    聖燈: "神僧の動きを一手に2回まで。各移動の直後に、隣接する敵1枚を任意で射撃できる。射撃後も2回目の移動を続けられる。8方向の5路以内にいる敵の五里霧を高道に戻す。"
  };
  const abilityName = document.querySelector("#ability-name");
  const abilityText = document.querySelector("#ability-text");
  const emptyHistory = document.querySelector("#empty-history");
  const sound = document.querySelector("#sound");
  let inspected;
  let audio;
  let soundEnabled = true;

  function unlockAudio() {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio || !soundEnabled) return;
    audio ??= new Audio();
    if (audio.state === "suspended") audio.resume().catch(() => {});
  }

  function impact(at, duration, frequency, gain, filterType) {
    const buffer = audio.createBuffer(1, Math.ceil(audio.sampleRate * duration), audio.sampleRate);
    const samples = buffer.getChannelData(0);
    for (let i = 0; i < samples.length; i++) {
      samples[i] = Math.random() * 2 - 1;
    }
    const noise = audio.createBufferSource();
    noise.buffer = buffer;
    const filter = audio.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.value = frequency;
    const volume = audio.createGain();
    volume.gain.setValueAtTime(.001, at);
    volume.gain.exponentialRampToValueAtTime(gain, at + .002);
    volume.gain.exponentialRampToValueAtTime(.001, at + duration);
    noise.connect(filter).connect(volume).connect(audio.destination);
    noise.start(at);
  }

  const vehicles = new Set(["車", "車総", "砲車", "神機車"]);
  const shields = new Set(["牌", "牌総", "天塁"]);
  const cavalry = new Set(["馬兵", "騎総", "天馬", "彍騎", "弩騎"]);
  const runners = new Set([
    "歩総", "都司", "先鋒", "象", "招揺", "霹靂", "百総", "把総", "千戸", "百戸",
    "副司", "前衝", "後衝", "天網", "地網", "鷹揚", "虎翼", "千総", "龍驤"
  ]);
  const bows = new Set(["弓", "弩", "彍騎", "弩騎"]);
  const cannons = new Set(["砲", "砲車", "仏狼機", "神機車"]);

  function tone(at, duration, start, end, gain, type = "triangle") {
    const oscillator = audio.createOscillator();
    const volume = audio.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(start, at);
    oscillator.frequency.exponentialRampToValueAtTime(end, at + duration);
    volume.gain.setValueAtTime(.001, at);
    volume.gain.exponentialRampToValueAtTime(gain, at + .003);
    volume.gain.exponentialRampToValueAtTime(.001, at + duration);
    oscillator.connect(volume).connect(audio.destination);
    oscillator.start(at);
    oscillator.stop(at + duration);
  }

  function movementSound(at, name) {
    if (vehicles.has(name)) {
      const squeaks = [[0, 2450], [.070, 2870], [.150, 2310], [.230, 2750], [.320, 2500]];
      for (const [offset, pitch] of squeaks) {
        const tick = at + offset;
        impact(tick, .037, pitch, .19, "bandpass");
        tone(tick, .030, pitch, pitch * .65, .054, "sine");
        tone(tick + .002, .024, pitch * 1.43, pitch * .91, .031, "sine");
      }
      return .36;
    }
    if (shields.has(name)) {
      impact(at, .024, 3600, .24, "bandpass");
      tone(at, .11, 1430, 1430, .12, "sine");
      tone(at, .08, 2210, 2210, .05, "sine");
      return .11;
    }
    if (cavalry.has(name)) {
      for (const offset of [0, .085, .16, .45, .535, .61]) {
        impact(at + offset, .030, 850, .25, "bandpass");
        tone(at + offset, .033, 245, 105, .10);
      }
      return .65;
    }
    if (runners.has(name)) {
      for (const offset of [0, .30, .60]) {
        impact(at + offset, .033, 1450, .28, "bandpass");
      }
      return .64;
    }
    impact(at, .075, 2100, .30, "bandpass");
    return .075;
  }

  function bowRelease(at) {
    const rate = audio.sampleRate;
    const buffer = audio.createBuffer(1, Math.round(rate * .13), rate);
    const samples = buffer.getChannelData(0);
    const period = Math.round(rate / 260);
    // A short impulse excites the string; each cycle loses its upper harmonics.
    for (let i = 0; i < period; i++) {
      samples[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / period);
    }
    for (let i = period; i < samples.length; i++) {
      samples[i] = .89 * (samples[i - period] + samples[i - period + 1]) / 2;
    }
    for (let i = 0; i < samples.length; i++) {
      samples[i] *= .36 * (1 - i / (samples.length - 1));
    }
    const release = audio.createBufferSource();
    release.buffer = buffer;
    release.connect(audio.destination);
    release.start(at);
  }

  function playSound(move, name) {
    if (!soundEnabled || audio?.state !== "running") return;
    const at = audio.currentTime;
    if (!move.shots.length) {
      movementSound(at, name);
      return;
    }
    if (bows.has(name)) {
      bowRelease(at);
    } else if (cannons.has(name)) {
      impact(at, .105, 950, .34, "lowpass");
    } else {
      impact(at, .065, 1500, .28, "bandpass");
    }
  }

  function moveSequence(move) {
    const shotSteps = move.shot_steps?.length ? move.shot_steps : move.shots.map(() => move.path.length);

      ...move.shots.flatMap((target, shot) => shotSteps[shot] === index + 1 ? [{kind: "shoot", square: target}] : [])

    return action.sequence ?? moveSequence(action);

  function record(move, before, quiet = false) {

    const route = moveSequence(move).reduce((text, event) =>
      text + (event.kind === "move" ? " → " : " ／ 射撃 ") + event.square, move.from);

  let engine;

  function browserPosition(history, opponent, operation = "position") {

      engine.onmessage = ({data: {id, state, error}}) => {
        const request = pending.get(id);
        pending.delete(id);
        if (error) request.reject(new Error(error));
        else request.resolve(state);
      };
      engine.onerror = () => {
        engine.terminate();
        engine = undefined;
        for (const request of pending.values()) request.reject(new Error("Worker failed"));
        pending.clear();
      };
    }
    return new Promise((resolve, reject) => {
      const id = ++requestId;
      pending.set(id, {resolve, reject});
      engine.postMessage({id, history, operation, opponent: opponent === "human" ? "" : opponent, humanSide});
    });
  }

  async function fetchPosition(moves, opponent = "human") {

    const response = await fetch(url, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(moves)
    });
    if (!response.ok) {
      const error = await response.json().catch(() => ({}));
      throw new Error(error.error || "HTTP " + response.status);
    }
    return response.json();
  }

  function updateGameActions() {

  for (const [id, destination] of [
    ["first", () => 0], ["prev", () => replay.index - 1],
    ["next", () => replay.index + 1], ["last", () => replay.record.history.length]
  ]) document.querySelector("#replay-" + id).addEventListener("click", () => { pauseReplay(); showReplay(destination()); });
  replaySlider.addEventListener("input", () => { pauseReplay(); showReplay(Number(replaySlider.value)); });
  replayPlay.addEventListener("click", () => {
    if (replayTimer) return pauseReplay();
    if (replay.index === replay.record.history.length) showReplay(0);
    replayPlay.textContent = "一時停止";
    replayTimer = setInterval(() => showReplay(replay.index + 1), 800);
  });
  load([]);
</script>
</html>
